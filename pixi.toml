[workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.13"
pip = "*"
pytest = ">=9.1.1,<10"

[pypi-dependencies]
py-doc-tools = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = "*"
ruff = "*"
mypy = "*"
mkdocs = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"

[feature.dev.pypi-dependencies]
py-structure-tools = { git = "https://gitlab.com/dev-tools-cr/python/py-structure-tools.git", branch = "main" }

[environments]
default = ["dev"]

[tasks]
fmt = "ruff format ."
lint = "ruff check ."
typecheck = "mypy src tests"
tests = "pytest"
check = { depends-on = ["fmt", "lint", "typecheck", "tests"] }

pydocs = "pydocs"

docs-diagnostics = "pydocs generate --diagnostics"
docs-todo = "pydocs generate --todo"
docs-all = "pydocs generate --all"

docs-tags-inject = "pydocs tags inject"
docs-tags-inject-dry = "pydocs tags inject --dry-run"
docs-tags-inject-write = "pydocs tags inject --write"

docs-tags-clean = "pydocs tags clean"
docs-tags-clean-dry = "pydocs tags clean --dry-run"
docs-tags-clean-write = "pydocs tags clean --write"

docs-build = "mkdocs build"
docs-build-strict = "mkdocs build --strict"

pystructure = "pystructure"
structure = "pystructure tree --root ."
structure-export = "pystructure export --root ."
structure-export-all = "pystructure export --root . --formats all"

docs-check = { depends-on = ["docs-diagnostics", "docs-todo", "docs-build"] }
docs-clean-tags-and-regenerate = { depends-on = ["docs-tags-clean-write", "docs-diagnostics", "docs-todo"] }
