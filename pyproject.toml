[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "py-doc-tools"
version = "0.1.0"
description = "Configurable MkDocs documentation generation tools for Python projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Clément RACINET" },
]
keywords = ["mkdocs", "documentation", "mkdocstrings", "dev-tools"]
dependencies = []

[project.optional-dependencies]
diagram = ["pyvis>=0.3.2"]

[project.scripts]
pydocs = "py_doc_tools.cli:main"
py-doc-tools = "py_doc_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_doc_tools"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    "FA",
    "FBT",
    "I",
    "ICN",
    "INP",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "TCH",
    "TRY",
    "UP",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["py_doc_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=py_doc_tools",
    "--cov-report=term-missing",
    "--cov-report=xml",
]


[tool.coverage.run]
branch = true
source = ["py_doc_tools"]
omit = [
    "src/py_doc_tools/__main__.py",
]


[tool.py-doc-tools]
enable_api = false
enable_examples = false
enable_readme = false
enable_todo = true
enable_diagnostics = true
enable_tags = true
enable_diagrams = false
enable_coverage = false

docs_dir = "docs"
docs_src_dir = "docs/src"
mkdocs_config = "mkdocs.yml"
packages = ["py_doc_tools"]


[tool.py-doc-tools.diagnostics]
output_dir = "docs/src/diagnostics"
ruff_output_file = "docs/src/diagnostics/ruff.md"
mkdocs_output_file = "docs/src/diagnostics/mkdocs.md"

enable_ruff = true
enable_mkdocs = true
mkdocs_strict = false

inject_source_tags = false

clean_before_inject = true
clean_legacy_tags = true

fail_on_ruff = false
fail_on_mkdocs = false

ruff_targets = ["src", "tests"]
ruff_exclude_dirs = [
    ".git",
    ".pixi",
    ".pytest_cache",
    "__pycache__",
    "docs/build",
    "site",
]
ruff_exclude_files = [
    "*.pyc",
    "*.pyo",
]

[tool.py-doc-tools.tags]
scan_roots = ["src", "tests"]
dry_run = true
generated_prefix = "py-doc-tools"
markers = ["TODO", "FIXME"]

exclude_dirs = [
    ".git",
    ".pixi",
    ".pytest_cache",
    "__pycache__",
    "docs/build",
    "site",
]
exclude_files = [
    "*.pyc",
    "*.pyo",
]

[tool.py-doc-tools.todo]
output_file = "docs/src/todo.md"
scan_roots = ["src", "tests"]
markers = ["TODO", "FIXME"]
mode = "sections"

exclude_dirs = [
    ".git",
    ".pixi",
    ".pytest_cache",
    "__pycache__",
    "docs/build",
    "site",
]
exclude_files = [
    "*.pyc",
    "*.pyo",
]
