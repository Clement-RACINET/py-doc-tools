site_name: py-doc-tools
site_description: Configurable MkDocs documentation generation tools for Python projects.
site_author: Clément RACINET

docs_dir: docs/src
site_dir: docs/build

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - TODO: todo.md
  - Diagnostics:
      - Ruff: diagnostics/ruff.md
      - MkDocs: diagnostics/mkdocs.md
